<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maintenance Entry App</title>
  <meta name="theme-color" content="#8B1A1A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maintenance">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #8B1A1A; }
    body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .offline { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; align-items: center; justify-content: center;
      color: #fff; font: 600 18px/1.4 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 24px; }
    body.is-offline .offline { display: flex; }
    body.is-offline iframe { visibility: hidden; }
  </style>
</head>
<body>
  <!-- The Maintenance Entry App (Google Apps Script web app) -->
  <iframe src="https://script.google.com/macros/s/AKfycbwVKF3b_OmaYhuXio7CdqKu1qdoQ5bvKmO7CMnvMxIvjj1mY2sTc52SkrqUlj6VZmMw/exec"
          title="Maintenance Entry App" allow="clipboard-write"></iframe>
  <div class="offline">No internet connection.<br>The maintenance list will load when you're back online.</div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
    function net() { document.body.classList.toggle('is-offline', !navigator.onLine); }
    window.addEventListener('online', function () { net(); location.reload(); });
    window.addEventListener('offline', net);
    net();
  </script>
</body>
</html>
